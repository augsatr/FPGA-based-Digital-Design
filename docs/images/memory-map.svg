<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Consolas, monospace">
  <defs>
    <linearGradient id="memBlock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A9C54;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="periphBlock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ioBlock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7D3C98;stop-opacity:1"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="#1a1a2e" rx="10"/>

  <text x="400" y="30" text-anchor="middle" fill="#E8E8E8" font-size="18" font-weight="bold">Memory Map</text>
  <text x="400" y="50" text-anchor="middle" fill="#888" font-size="11">32-bit Address Space | Memory-Mapped I/O</text>

  <!-- Address bar -->
  <rect x="100" y="70" width="600" height="340" rx="8" fill="#111133" stroke="#333" stroke-width="1"/>

  <!-- Memory blocks -->
  <rect x="110" y="80" width="580" height="45" rx="5" fill="url(#memBlock)" filter="url(#s)"/>
  <text x="130" y="100" fill="white" font-size="12" font-weight="bold">Instruction Memory (ROM)</text>
  <text x="130" y="118" fill="#ddd" font-size="9">1KB | Read-Only | Program Storage</text>
  <text x="670" y="100" text-anchor="end" fill="#FFD700" font-size="10" font-weight="bold">0x00000000</text>
  <text x="670" y="118" text-anchor="end" fill="#aaa" font-size="8">0x00000FFF</text>

  <rect x="110" y="135" width="580" height="45" rx="5" fill="url(#memBlock)" filter="url(#s)"/>
  <text x="130" y="155" fill="white" font-size="12" font-weight="bold">Data Memory (RAM)</text>
  <text x="130" y="173" fill="#ddd" font-size="9">1KB | Read-Write | Byte-Enable | Store Buffer</text>
  <text x="670" y="155" text-anchor="end" fill="#FFD700" font-size="10" font-weight="bold">0x00001000</text>
  <text x="670" y="173" text-anchor="end" fill="#aaa" font-size="8">0x00001FFF</text>

  <rect x="110" y="190" width="580" height="45" rx="5" fill="url(#periphBlock)" filter="url(#s)"/>
  <text x="130" y="210" fill="white" font-size="12" font-weight="bold">UART Controller</text>
  <text x="130" y="228" fill="#ddd" font-size="9">TX/RX FIFO | 5 Baud Rates | RTS/CTS Flow Control</text>
  <text x="670" y="210" text-anchor="end" fill="#FFD700" font-size="10" font-weight="bold">0x00002000</text>
  <text x="670" y="228" text-anchor="end" fill="#aaa" font-size="8">0x0000201F</text>

  <rect x="110" y="245" width="580" height="45" rx="5" fill="url(#periphBlock)" filter="url(#s)"/>
  <text x="130" y="265" fill="white" font-size="12" font-weight="bold">Timer</text>
  <text x="130" y="283" fill="#ddd" font-size="9">32-bit Counter | Compare | Auto-Reload | IRQ</text>
  <text x="670" y="265" text-anchor="end" fill="#FFD700" font-size="10" font-weight="bold">0x00003000</text>
  <text x="670" y="283" text-anchor="end" fill="#aaa" font-size="8">0x0000300F</text>

  <rect x="110" y="300" width="580" height="45" rx="5" fill="url(#periphBlock)" filter="url(#s)"/>
  <text x="130" y="320" fill="white" font-size="12" font-weight="bold">GPIO Controller</text>
  <text x="130" y="338" fill="#ddd" font-size="9">16-bit Port | Edge/Level IRQ | W1C Status</text>
  <text x="670" y="320" text-anchor="end" fill="#FFD700" font-size="10" font-weight="bold">0x00004000</text>
  <text x="670" y="338" text-anchor="end" fill="#aaa" font-size="8">0x0000401F</text>

  <rect x="110" y="355" width="290" height="45" rx="5" fill="url(#periphBlock)" filter="url(#s)"/>
  <text x="130" y="375" fill="white" font-size="12" font-weight="bold">Int Controller</text>
  <text x="130" y="393" fill="#ddd" font-size="9">8-Source Priority</text>
  <text x="390" y="375" text-anchor="end" fill="#FFD700" font-size="10" font-weight="bold">0x00005000</text>
  <text x="390" y="393" text-anchor="end" fill="#aaa" font-size="8">0x0000500F</text>

  <rect x="400" y="355" width="140" height="45" rx="5" fill="url(#ioBlock)" filter="url(#s)"/>
  <text x="470" y="375" text-anchor="middle" fill="white" font-size="10" font-weight="bold">7-Seg</text>
  <text x="470" y="390" text-anchor="middle" fill="#ddd" font-size="8">0x00006000</text>

  <rect x="550" y="355" width="140" height="45" rx="5" fill="url(#ioBlock)" filter="url(#s)"/>
  <text x="620" y="375" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LED</text>
  <text x="620" y="390" text-anchor="middle" fill="#ddd" font-size="8">0x00007000</text>

  <!-- Legend -->
  <rect x="100" y="410" width="600" height="35" rx="5" fill="#222244" stroke="#444" stroke-width="1"/>
  <rect x="120" y="420" width="12" height="10" rx="2" fill="#2ECC71"/>
  <text x="138" y="429" fill="#aaa" font-size="8">Memory</text>
  <rect x="200" y="420" width="12" height="10" rx="2" fill="#E74C3C"/>
  <text x="218" y="429" fill="#aaa" font-size="8">Peripheral</text>
  <rect x="300" y="420" width="12" height="10" rx="2" fill="#9B59B6"/>
  <text x="318" y="429" fill="#aaa" font-size="8">I/O</text>
  <text x="400" y="429" fill="#666" font-size="8">All registers are 32-bit aligned</text>
</svg>
